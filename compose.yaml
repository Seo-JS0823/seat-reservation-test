services:
  postgres-loadtest:
    image: postgres:17
    container_name: seat-postgres-loadtest
    environment:
      POSTGRES_DB: seat_loadtest
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - seat_postgres_loadtest_data:/var/lib/postgresql/data
  postgres:
    image: postgres:17
    container_name: seat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - seat_postgres_data:/var/lib/postgresql

volumes:
  seat_postgres_data:
  seat_postgres_loadtest_data: