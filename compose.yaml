services:
  postgres:
    image: postgres:17
    container_name: seat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - seat_postgres_data:/var/lib/postgres

volumes:
  seat_postgres_data: